plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ayaanshaikh.offline'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.ayaanshaikh.offline'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
        testInstrumentationRunner 'com.ayaanshaikh.offline.NativeSyncSmoke'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    // Override the extractor's transitive version to include the XML parser resource-consumption fix.
    implementation 'org.jsoup:jsoup:1.24.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Robolectric changes process-wide crypto providers. Keep real JDK transport tests
// in their own worker, while retaining the documented unit-test entry point.
afterEvaluate {
    tasks.withType(Test).findAll { it.name.endsWith('UnitTest') }.each { unit ->
        def transport = tasks.register(unit.name.replace('UnitTest', 'Transport'), Test) {
            group = 'verification'
            description = 'Runs loopback download transport tests in an isolated JVM.'
            testClassesDirs = unit.testClassesDirs
            classpath = unit.classpath
            include '**/AudioTransportTest.class'
        }
        unit.exclude '**/AudioTransportTest.class'
        unit.dependsOn transport
    }
}
